# TB-X505L: PM8953 HPHL/HPHR feed the two external speaker amplifiers.
# Match Android codec gain at 0 dB; PipeWire provides stereo software volume.
SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"
	]
	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Internal Speakers"
	EnableSequence [
		cset "name='RX1 Digital Volume' 84"
		cset "name='RX2 Digital Volume' 84"
		cset "name='RX1 MIX1 INP1' RX1"
		cset "name='RX2 MIX1 INP1' RX2"
		cset "name='RDAC2 MUX' RX2"
		cset "name='HPHL' Switch"
		cset "name='HPHR' Switch"
		cset "name='RX1 Mute Switch' 0"
		cset "name='RX2 Mute Switch' 0"
		cset "name='Speakers Switch' 1"
	]
	DisableSequence [
		cset "name='Speakers Switch' 0"
		cset "name='HPHL' ZERO"
		cset "name='HPHR' ZERO"
		cset "name='RX1 MIX1 INP1' ZERO"
		cset "name='RX2 MIX1 INP1' ZERO"
	]
	Value {
		PlaybackPCM "hw:${CardId},0"
		PlaybackPriority 200
		PlaybackChannels 2
		PlaybackRate 48000
	}
}
