name: Build, verify and publish ARM64 APK repository
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: rpd-apk-production
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      revision: ${{ steps.revision.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.sha }}
          persist-credentials: ${{ github.ref == 'refs/heads/main' }}
      - name: Test packaging logic
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Check signed upstream releases
        # Pushes publish reviewed pins; scheduled/manual builds follow releases.
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:edge sh -ec 'apk add --no-cache python3; python3 scripts/update-m10-kernel.py > kernel-update-status.json; python3 scripts/update-mesa.py'
          sudo chown -R "$(id -u):$(id -g)" ports/rpd-backlight-m10 ports/mesa
          cat kernel-update-status.json
          python3 scripts/update-upstream.py
      - name: Retain kernel tracking decision
        if: github.ref == 'refs/heads/main' && github.event_name != 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kernel-update-status
          path: kernel-update-status.json
          retention-days: 3
      - name: Allocate APK revision
        if: github.ref == 'refs/heads/main'
        run: |
          python3 scripts/bump-revision.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add upstream.lock.json m10-kernel.lock.json ports/
          git commit -m 'Update published upstream sources and APK build revisions'
          git push origin HEAD:main
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
  qt6:
    needs: prepare
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Verify Qt6 GTK2 compatibility before the full build
        run: docker run --rm -v "$PWD:/work" -w /work alpine:edge sh scripts/qt6-preflight.sh
  runtime:
    needs: [prepare, qt6]
    strategy:
      fail-fast: false
      matrix:
        package: [polkit, squeekboard]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Build native runtime with an ephemeral key
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p out-security
          docker run --rm \
            -e ABUILD_LAST_COMMIT="$(git rev-parse HEAD)" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e "PACKAGER=RPD CI <rpd-ci-$PACKAGE@rpd.invalid>" \
            -v "$PWD:/work:ro" -v "$PWD/out-security:/out" -w /work \
            alpine:edge sh scripts/runtime-security-build.sh "$PACKAGE"
          sudo chown -R "$(id -u):$(id -g)" out-security
          git archive --format=tar.gz HEAD > "out-security/$PACKAGE/sources/rpd-apk-packaging.tar.gz"
          git rev-parse HEAD > "out-security/$PACKAGE/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-runtime-${{ matrix.package }}
          path: out-security/${{ matrix.package }}/
          retention-days: 3
  kernel:
    needs: [prepare, qt6]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Build complete kernel and matching modules with an ephemeral key
        run: |
          mkdir -p out-kernel
          docker run --rm \
            -e RPD_SOURCE_COMMIT="$(git rev-parse HEAD)" \
            -e ABUILD_LAST_COMMIT="$(git rev-parse HEAD)" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e 'PACKAGER=RPD CI <rpd-ci-kernel@rpd.invalid>' \
            -v "$PWD:/work:ro" -v "$PWD/out-kernel:/out" -w /work \
            alpine:edge sh scripts/kernel-security-build.sh
          sudo chown -R "$(id -u):$(id -g)" out-kernel
          git archive --format=tar.gz HEAD > out-kernel/sources/rpd-apk-packaging.tar.gz
          git rev-parse HEAD > out-kernel/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-kernel
          path: out-kernel/
          retention-days: 3
          compression-level: 0
      - name: Retain failed kernel build diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-kernel-failure-diagnostics
          path: |
            out-kernel/proof/
            out-kernel/metrics/
          retention-days: 3
  webkit:
    needs: [prepare, qt6]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - name: Build native GTK4 WebKit with an ephemeral key
        run: |
          mkdir -p out-webkit
          docker run --rm \
            -e RPD_DISPOSABLE_BUILD=1 \
            -e RPD_SOURCE_REVISION="$(git rev-parse HEAD)" \
            -e ABUILD_LAST_COMMIT="$(git rev-parse HEAD)" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e 'PACKAGER=RPD CI <rpd-ci-webkit@rpd.invalid>' \
            -v "$PWD:/work:ro" -v "$PWD/out-webkit:/out" -w /work \
            alpine:edge sh scripts/webkit-build.sh
          sudo chown -R "$(id -u):$(id -g)" out-webkit
          git archive --format=tar.gz HEAD > out-webkit/sources/rpd-apk-packaging.tar.gz
          git rev-parse HEAD > out-webkit/source-commit.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-webkit
          path: out-webkit/
          retention-days: 3
          compression-level: 0
  build:
    needs: [prepare, qt6, runtime, kernel, webkit]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-runtime-polkit
          path: ${{ runner.temp }}/rpd-native/polkit
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-runtime-squeekboard
          path: ${{ runner.temp }}/rpd-native/squeekboard
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-kernel
          path: ${{ runner.temp }}/rpd-native/kernel
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-webkit
          path: ${{ runner.temp }}/rpd-native/webkit
      - name: Build and test the combined repository with an ephemeral key
        run: |
          docker run --rm \
            -e RPD_IMPORT_DIR=/incoming \
            -e ABUILD_LAST_COMMIT="$(git rev-parse HEAD)" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -e 'PACKAGER=RPD CI <rpd-ci-desktop@rpd.invalid>' \
            -v "$RUNNER_TEMP/rpd-native:/incoming:ro" -v "$PWD:/work" -w /work \
            alpine:edge sh scripts/build.sh
          sudo chown -R "$(id -u):$(id -g)" out
      - name: Include exact packaging sources
        run: git archive --format=tar.gz HEAD > out/sources/rpd-apk-packaging.tar.gz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: verified-test-build
          path: out/
          retention-days: 3
  sign:
    if: github.ref == 'refs/heads/main'
    needs: [prepare, build]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.revision }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: verified-test-build
          path: out/
      - name: Check public archive size before accessing the signing key
        run: python3 scripts/check-pages-size.py out --extra docs --extra README.md --extra scripts/install-repository.sh --extra keys/rpd-apk.rsa.pub
      - name: Prepare isolated signing container
        run: |
          docker create --name signer -v "$PWD:/work" -w /work alpine:edge sleep infinity
          docker start signer
          docker exec signer apk add --no-cache abuild python3 openssl
      - name: Sign verified packages
        env:
          APK_SIGNING_KEY: ${{ secrets.APK_SIGNING_KEY }}
        run: |
          set -eu
          test -n "$APK_SIGNING_KEY"
          umask 077
          keyfile="$RUNNER_TEMP/rpd-apk.rsa"
          trap 'rm -f "$keyfile"; docker exec signer rm -f /tmp/rpd-apk.rsa' EXIT
          printf '%s\n' "$APK_SIGNING_KEY" > "$keyfile"
          docker cp "$keyfile" signer:/tmp/rpd-apk.rsa
          docker exec signer python3 scripts/sign.py /tmp/rpd-apk.rsa
      - name: Verify production signatures and runtime in a fresh container
        run: docker run --rm -v "$PWD:/work" -w /work alpine:edge sh scripts/verify-release.sh
      - name: Prepare public archive
        run: |
          cp README.md out/README.md
          cp -r docs out/
          printf '%s\n' '<!doctype html><meta charset="utf-8"><title>RPD APK</title><h1>RPD APK</h1><p>Unofficial portable Raspberry Pi desktop for postmarketOS / Alpine aarch64.</p><ul><li><a href="https://github.com/frenchfaso/rpd-apk">Sources and setup instructions</a></li><li><a href="rpd-apk.rsa.pub">APK public signing key</a></li><li><a href="validation.txt">Build validation</a></li><li><a href="rpd-headless.png">Headless desktop test</a></li><li><a href="upstream.lock.json">Pinned upstream sources</a></li></ul>' > out/index.html
          cp scripts/install-repository.sh out/
          touch out/.nojekyll
          test -z "$(find out -type f \( -name '*.rsa' -o -name '*.pem' \) -print)"
          python3 scripts/check-pages-size.py out
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: out/
          include-hidden-files: true # Retain the existing .nojekyll marker.
      - name: Remove signing container
        if: always()
        run: docker rm -f signer || true
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
