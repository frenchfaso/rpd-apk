name: Verify native runtime security candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    strategy:
      fail-fast: false
      matrix:
        package: [polkit, squeekboard]
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build, test and authenticate candidate
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          mkdir -p out-security
          docker run --rm \
            -e ABUILD_LAST_COMMIT="$GITHUB_SHA" \
            -e "PACKAGER=RPD CI <rpd-ci-$PACKAGE@rpd.invalid>" \
            -e SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" \
            -v "$PWD:/work:ro" -v "$PWD/out-security:/out" -w /work \
            alpine:edge sh scripts/runtime-security-build.sh "$PACKAGE"
          sudo chown -R "$(id -u):$(id -g)" out-security
          git archive --format=tar.gz HEAD > "out-security/$PACKAGE/sources/rpd-apk-packaging.tar.gz"
          git rev-parse HEAD > "out-security/$PACKAGE/source-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runtime-security-${{ matrix.package }}
          path: out-security/${{ matrix.package }}/
          retention-days: 7
