name: Verify Qt6 GTK2 compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt6:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compile both plugins and test cached widget rendering
        run: docker run --rm -v "$PWD:/work" -w /work alpine:edge sh scripts/qt6-preflight.sh
