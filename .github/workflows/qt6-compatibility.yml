name: Verify Qt6 GTK2 compatibility
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qt6:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compile both plugins and test cached widget rendering
        run: docker run --rm -v "$PWD:/work" -w /work alpine:edge sh scripts/qt6-preflight.sh
